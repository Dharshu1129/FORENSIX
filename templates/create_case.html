{% extends 'base.html' %}

{% block title %}Create Case — FORENSIX{% endblock %}
{% block header_title %}Initialize Forensic Case{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card card-soc">
            <div class="card-soc-header">
                <span><i class="bi bi-folder-plus text-info me-2"></i>New Forensic Case Entry</span>
                <span class="badge bg-info bg-opacity-25 text-info">Auto ID: {{ auto_case_num }}</span>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('cases.create_case') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Case Identifier</label>
                        <input type="text" class="form-control form-control-soc text-info fw-bold" value="{{ auto_case_num }}" readonly>
                        <div class="form-text text-muted">Automatically assigned unique forensic case tracking number.</div>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Case Title / Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-soc" id="name" name="name" placeholder="e.g. Internal Data Exfiltration Incident - Server Alpha" required>
                    </div>

                    <div class="mb-3">
                        <label for="investigator" class="form-label fw-semibold">Lead Investigator Name</label>
                        <input type="text" class="form-control form-control-soc" id="investigator" name="investigator" value="Lead Investigator" placeholder="Name of primary examiner">
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label fw-semibold">Case Background & Scope Description</label>
                        <textarea class="form-control form-control-soc" id="description" name="description" rows="4" placeholder="Detail incident background, initial observations, and target assets..."></textarea>
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary border-opacity-25">
                        <a href="{{ url_for('cases.list_cases') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-info fw-semibold px-4">
                            <i class="bi bi-shield-check me-1"></i> Initialize Case
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
